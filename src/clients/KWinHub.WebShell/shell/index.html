<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KWinHub WebShell</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --panel-hover: #273549;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #2dd4bf;
        --accent-dim: rgba(45, 212, 191, 0.15);
        --header-height: 52px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header.topbar {
        flex: 0 0 var(--header-height);
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 0 1rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        user-select: none;
        -webkit-app-region: drag;
      }
      .brand {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
        -webkit-app-region: drag;
      }
      .brand .title {
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .brand .title span { color: var(--accent); }
      .brand .subtitle {
        font-size: 0.7rem;
        color: var(--muted);
      }
      nav.tabs {
        display: flex;
        gap: 0.25rem;
        -webkit-app-region: no-drag;
      }
      nav.tabs button {
        appearance: none;
        background: transparent;
        border: 1px solid transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.85rem;
        padding: 0.35rem 0.9rem;
        border-radius: 8px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      nav.tabs button:hover {
        background: var(--panel-hover);
        color: var(--text);
      }
      nav.tabs button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      nav.tabs button.active {
        background: var(--accent-dim);
        color: var(--accent);
        border-color: rgba(45, 212, 191, 0.35);
      }
      nav.tabs button kbd {
        padding: 0 0.3rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.25);
        font-size: 0.7rem;
        color: var(--muted);
      }
      nav.tabs button.active kbd {
        border-color: rgba(45, 212, 191, 0.35);
        color: var(--accent);
      }
      .spacer { flex: 1; }
      .workspace-label {
        font-size: 0.7rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        -webkit-app-region: no-drag;
      }
      main.stage {
        position: relative;
        flex: 1;
        overflow: hidden;
      }
      .view {
        position: absolute;
        inset: 0;
        visibility: hidden;
        pointer-events: none;
        z-index: 0;
      }
      .view.active {
        visibility: visible;
        pointer-events: auto;
        z-index: 1;
      }
      iframe.app-frame {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      #home {
        overflow: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
        padding: 2rem;
        text-align: center;
      }
      #home header h1 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: 0.02em;
      }
      #home header h1 span { color: var(--accent); }
      #home header p {
        margin: 0.5rem 0 0;
        color: var(--muted);
      }
      .cards {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      button.card {
        display: block;
        width: 320px;
        padding: 1.75rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-align: left;
        cursor: pointer;
        color: inherit;
        font: inherit;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      }
      button.card:hover, button.card:focus-visible {
        background: var(--panel-hover);
        border-color: var(--accent);
        transform: translateY(-2px);
        outline: none;
      }
      button.card h2 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      button.card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button.card .open {
        display: inline-block;
        margin-top: 1.25rem;
        color: var(--accent);
        font-size: 0.85rem;
        font-weight: 600;
      }
      #home footer {
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.6;
      }
      #home footer kbd {
        padding: 0.1rem 0.35rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--panel);
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="title">KWinHub <span>WebShell</span></span>
        <span class="subtitle">Kunwei Sports</span>
      </div>
      <nav class="tabs" aria-label="Application navigation">
        <button id="tab-home" data-view="home" type="button">Home <kbd>Ctrl+0</kbd></button>
        <button id="tab-web" data-view="web" type="button">KWinHub Web <kbd>Ctrl+1</kbd></button>
        <button id="tab-console" data-view="console" type="button">Platform Console <kbd>Ctrl+2</kbd></button>
      </nav>
      <div class="spacer"></div>
      <span class="workspace-label">Current Workspace</span>
    </header>

    <main class="stage">
      <section id="home" class="view" role="region" aria-label="Home">
        <header>
          <h1>KWinHub <span>WebShell</span></h1>
          <p>Desktop host for the KWinHub prototype frontends.</p>
        </header>
        <div class="cards">
          <button class="card" data-view="web" type="button">
            <h2>KWinHub Web</h2>
            <p>Team and athlete workspace &mdash; sessions, results, performance analysis and reports. Runs on the in-memory demo dataset.</p>
            <span class="open">Open &rarr;</span>
          </button>
          <button class="card" data-view="console" type="button">
            <h2>Platform Console</h2>
            <p>Platform administration &mdash; organizations, users, protocol and metric catalogs, audit logs. Runs on the built-in mock API.</p>
            <span class="open">Open &rarr;</span>
          </button>
        </div>
        <footer>
          Demo build &mdash; no backend required.<br />
          Switch apps from the tabs above, the <strong>Navigate</strong> menu, or
          <kbd>Ctrl+0</kbd> home, <kbd>Ctrl+1</kbd> web, <kbd>Ctrl+2</kbd> console.
        </footer>
      </section>

      <iframe id="frame-web" class="view app-frame" src="web/index.html" title="KWinHub Web" referrerpolicy="no-referrer"></iframe>
      <iframe id="frame-console" class="view app-frame" src="console/index.html" title="Platform Console" referrerpolicy="no-referrer"></iframe>
    </main>

    <script>
      (function () {
        const VIEWS = ['home', 'web', 'console'];
        const STORAGE_KEY = 'kwinhub.activeView';

        const tabs = {
          home: document.getElementById('tab-home'),
          web: document.getElementById('tab-web'),
          console: document.getElementById('tab-console'),
        };
        const views = {
          home: document.getElementById('home'),
          web: document.getElementById('frame-web'),
          console: document.getElementById('frame-console'),
        };

        let current = 'home';

        function isValidView(v) {
          return VIEWS.indexOf(v) !== -1;
        }

        function switchView(view) {
          if (!isValidView(view)) return;
          if (view === current) return;
          current = view;
          for (const key of VIEWS) {
            const active = key === view;
            if (tabs[key]) tabs[key].classList.toggle('active', active);
            if (views[key]) views[key].classList.toggle('active', active);
          }
          try { localStorage.setItem(STORAGE_KEY, view); } catch (e) {}
        }

        window.switchView = switchView;

        for (const key of VIEWS) {
          if (tabs[key]) {
            tabs[key].addEventListener('click', function () { switchView(key); });
          }
        }
        document.querySelectorAll('button.card[data-view]').forEach(function (btn) {
          btn.addEventListener('click', function () { switchView(btn.getAttribute('data-view')); });
        });

        window.addEventListener('message', function (event) {
          const data = event.data;
          if (data && typeof data === 'object' && data.type === 'kwinhub:navigate' && isValidView(data.view)) {
            switchView(data.view);
          }
        });

        window.addEventListener('keydown', function (event) {
          if (!(event.ctrlKey || event.metaKey)) return;
          if (event.key === '0') { event.preventDefault(); switchView('home'); }
          else if (event.key === '1') { event.preventDefault(); switchView('web'); }
          else if (event.key === '2') { event.preventDefault(); switchView('console'); }
        });

        // The frontends are not modified for the shell. KWinHub Web's platform
        // admin login link normally detects Tauri via __TAURI_INTERNALS__ (which
        // is not injected into child iframes) and otherwise opens the console in
        // a new tab/window. Because the iframes are same-origin with this shell,
        // we intercept clicks on links targeting the console and switch views
        // instead, keeping the demo's in-app navigation working without
        // reloading either frontend.
        function isConsoleLink(href) {
          if (!href) return false;
          return /(^|\/)console\/index\.html(\?|#|$)/.test(href) ||
            /\/console(\?|#|$)/.test(href) ||
            /localhost:5174/.test(href);
        }

        function hookConsoleLinks(iframe) {
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.addEventListener('click', function (e) {
              const target = e.target;
              const anchor = target && target.closest ? target.closest('a') : null;
              if (!anchor) return;
              const href = anchor.getAttribute('href') || '';
              if (isConsoleLink(href)) {
                e.preventDefault();
                switchView('console');
              }
            }, true);
          } catch (e) {
            // Ignore cross-origin access errors; the same-origin check above
            // is only a safety net since assets are served from one origin.
          }
        }

        const frameWeb = views.web;
        if (frameWeb.addEventListener) {
          frameWeb.addEventListener('load', function () { hookConsoleLinks(frameWeb); });
          if (frameWeb.contentDocument && frameWeb.contentDocument.readyState === 'complete') {
            hookConsoleLinks(frameWeb);
          }
        }

        let initial = 'home';
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (isValidView(saved)) initial = saved;
        } catch (e) {}
        switchView(initial);
      })();
    </script>
  </body>
</html>
